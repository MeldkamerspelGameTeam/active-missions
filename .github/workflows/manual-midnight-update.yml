name: Manual Midnight Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-midnight-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generator
        run: python main.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD }}

      - name: Run recent-seen overview
        run: python generate_recent_seen_overview.py

      - name: Commit and push midnight-flow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json
          git add missions_seen_last_30_days_grouped.md

          # Always persist reporting state to avoid duplicate Discord notifications.
          git add data/reported_missions.json
          git add data/weekly_status.json
          git add data/inactive_state.json

          git add never_seen_missions_summary.md old_seen_missions_summary.md inactive_missions_grouped_by_date.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: run manual midnight flow"
            git push
          fi
