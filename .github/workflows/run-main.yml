name: Update Mission Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generator
        run: python scripts/main.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD }}

      - name: Send weekly totals to Discord (Monday 08:00 Dutch time)
        run: |
          DUTCH_WEEKDAY=$(TZ=Europe/Amsterdam date +%u)
          DUTCH_HOUR=$(TZ=Europe/Amsterdam date +%H)
          if [ "$DUTCH_WEEKDAY" = "1" ] && [ "$DUTCH_HOUR" = "08" ]; then
            echo "Dutch time is Monday 08:xx, sending weekly totals summary."
            python scripts/send_weekly_discord_summary.py
          else
            echo "Dutch time is weekday ${DUTCH_WEEKDAY}, hour ${DUTCH_HOUR}:xx, skipping weekly totals summary."
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD }}

      - name: Run recent-seen overview (Dutch 00:00 hour only)
        run: |
          DUTCH_HOUR=$(TZ=Europe/Amsterdam date +%H)
          if [ "$DUTCH_HOUR" = "00" ]; then
            echo "Dutch time is 00:xx, running recent-seen overview script."
            python scripts/generate_recent_seen_overview.py
          else
            echo "Dutch time is ${DUTCH_HOUR}:xx, skipping recent-seen overview script."
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DUTCH_HOUR=$(TZ=Europe/Amsterdam date +%H)
          if [ "$DUTCH_HOUR" = "00" ]; then
            echo "Dutch time is 00:xx, including data/*.json and grouped recent-seen overview in commit."
            git add data/*.json
            git add missions_seen_last_30_days_grouped.md
          else
            echo "Dutch time is ${DUTCH_HOUR}:xx, skipping data/*.json commit."
          fi

          # Always persist reporting state to avoid duplicate Discord notifications.
          git add data/reported_missions.json
          git add data/weekly_status.json
          git add data/inactive_state.json

          git add never_seen_missions_summary.md old_seen_missions_summary.md inactive_missions_grouped_by_date.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update mission data"
            git push
          fi
